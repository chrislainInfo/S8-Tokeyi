<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta
    name="description"
    content="Confirmation d’une demande effectuée sur le service de covoiturage Tokeyi."
  >
  <title>Confirmation | Tokeyi</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="confirmation.css">
</head>
<body id="page-confirmation" class="standalone-page">
  <a class="skip-link" href="#main-content">Aller au contenu</a>

  <header class="standalone-header">
    <a class="brand" href="../accueil/index.html" aria-label="Tokeyi, accueil">
      <span class="brand-logo" aria-hidden="true">
        <img
          src="../assets/brand/logo-tokeyi-light-v2.png"
          alt=""
          width="2172"
          height="724"
        >
      </span>
    </a>
    <!-- NE PAS MODIFIER l'id : main.js y affiche l'état de connexion. -->
    <div id="nav-session" aria-live="polite"></div>
  </header>

  <main class="standalone-main" id="main-content">
    <section class="confirmation-panel" aria-labelledby="confirmation-title">
      <div class="confirmation-panel__visual" aria-hidden="true">
        <i class="ph ph-check icon-xl"></i>
      </div>
      <span class="badge badge--success">Demande enregistrée</span>
      <h1 id="confirmation-title">Votre demande est bien prise en compte</h1>
      <!-- NE PAS MODIFIER l'id : main.js injecte le message de confirmation. -->
      <p id="confirmation-message" class="confirmation-message" aria-live="polite">
        Votre demande a été enregistrée. Vous pouvez maintenant consulter vos trajets.
      </p>

      <section class="prochaines-etapes" aria-labelledby="next-steps-title">
        <h2 id="next-steps-title">Que souhaitez-vous faire maintenant&nbsp;?</h2>
        <div class="next-actions">
          <a
            id="lien-mes-trajets"
            class="button button--primary"
            href="../mes-trajets/mes-trajets.html"
          >
            <i class="ph ph-ticket icon" aria-hidden="true"></i>
            Voir mes trajets
          </a>
          <a class="button button--secondary" href="../recherche/recherche.html">
            <i class="ph ph-magnifying-glass icon" aria-hidden="true"></i>
            Rechercher d’autres trajets
          </a>
          <a class="button button--ghost" href="../accueil/index.html">
            Retour à l’accueil
          </a>
        </div>
      </section>
    </section>
  </main>

  <!-- NE PAS MODIFIER : scripts de connexion au backend. -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
