name: Qualite du projet

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: project-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v6

      - name: Installation de Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installation des dependances backend
        run: python -m pip install --requirement backend/requirements.txt

      - name: Execution des tests backend
        working-directory: backend
        run: python -m pytest --verbose

  w3c-validation:
    name: Validation W3C
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v6

      - name: Validation des fichiers HTML
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/frontend:/data:ro"
          ghcr.io/validator/validator:latest
          vnu --errors-only --skip-non-html /data

  lighthouse-audit:
    name: Audit Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v6

      - name: Audit des pages frontend
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          artifactName: rapports-lighthouse
